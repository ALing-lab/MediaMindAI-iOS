name: iOS Unsigned IPA

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image: xcode-27 (iOS 27 SDK) or macos-15 (fallback when the xcode-27 preview pool is busy)'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - macos-15
          - macos-15-intel

jobs:
  build:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v4

      - name: Core logic tests (SwiftPM, macOS)
        working-directory: MediaMindAI-iOS
        run: swift test

      - name: Build unsigned app
        if: ${{ !cancelled() }}
        working-directory: MediaMindAI-iOS
        run: |
          xcodebuild build \
            -project MediaMindAI.xcodeproj \
            -scheme MediaMindAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        if: ${{ !cancelled() }}
        working-directory: MediaMindAI-iOS
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r MediaMindAI-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unsigned-ipa
          path: MediaMindAI-iOS/MediaMindAI-unsigned.ipa
