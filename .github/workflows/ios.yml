name: iOS Unsigned IPA

on: [push]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core logic tests (SwiftPM, macOS)
        working-directory: MediaMindAI-iOS
        run: swift test

      - name: Build unsigned app
        working-directory: MediaMindAI-iOS
        run: |
          xcodebuild build \
            -project MediaMindAI.xcodeproj \
            -target MediaMindAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: MediaMindAI-iOS
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r MediaMindAI-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: MediaMindAI-iOS/MediaMindAI-unsigned.ipa
